<section
  class="relative grid h-[90px] w-full grid-cols-[minmax(0,1fr)_minmax(0,2fr)_minmax(0,1fr)] items-center border-t border-[var(--color-player-border)] bg-[var(--color-player-background)] px-5 text-[var(--color-player-text)]"
  aria-label="Reproductor de audio"
>
  <audio
    #audio
    class="hidden"
    [attr.src]="audioUrl"
    preload="metadata"
    (timeupdate)="updatePlayback(audio)"
    (loadedmetadata)="initializeAudio(audio)"
    (play)="isPlaying = true"
    (pause)="isPlaying = false"
    (ended)="handleTrackEnded()"
    (error)="playbackError = 'No se pudo cargar el archivo de audio.'"
  >
    Tu navegador no soporta la reproducción de audio.
  </audio>

  <div class="flex min-w-0 items-center gap-3">
    <div
      class="flex size-[52px] shrink-0 items-center justify-center rounded-[4px] border border-[var(--color-player-cover-accent)] bg-[var(--color-player-cover-background)]"
      aria-hidden="true"
    >
      <div
        class="flex size-7 items-center justify-center rounded-full border border-[var(--color-player-cover-accent)] bg-[var(--color-player-cover-accent)]/20"
      >
        <svg
          class="size-4 text-[var(--color-player-cover-accent)]"
          viewBox="0 0 24 24"
          fill="currentColor"
        >
          <path
            d="M12 3v12.2a3.5 3.5 0 1 1-2-3.16V7.2l10-2.5v10.5a3.5 3.5 0 1 1-2-3.16V3.64L12 5.14V3Z"
          />
        </svg>
      </div>
    </div>
    <div class="flex min-w-0 flex-col gap-1">
      <span class="truncate text-sm font-semibold">
        {{ currentTrack ? currentTrack.name + ' — ' + currentTrack.artists : 'Sin canción seleccionada' }}
      </span>
      <span class="truncate text-xs text-[var(--color-player-secondary)]">
        {{ currentTrack?.fileName ?? 'Selecciona una canción de la biblioteca' }}
      </span>
    </div>
  </div>

  <div class="flex min-w-0 flex-col items-center gap-2">
    <div
      class="flex h-[42px] items-center justify-center gap-6 text-[var(--color-player-secondary)]"
    >
      <button
        type="button"
        aria-label="Anterior"
        (click)="previousTrack(audio)"
        [disabled]="!canGoToPreviousTrack"
        class="transition-colors hover:text-[var(--color-player-text)] disabled:cursor-not-allowed disabled:opacity-40"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 5h2v14H6zm13 1v12L9 12z" />
        </svg>
      </button>
      <button
        type="button"
        [attr.aria-label]="isPlaying ? 'Pausar' : 'Reproducir'"
        (click)="togglePlayback(audio)"
        [disabled]="!audioUrl"
        class="flex size-[42px] items-center justify-center rounded-full bg-[var(--color-player-control-background)] text-[var(--color-player-control-icon)]"
      >
        @if (isPlaying) {
          <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M6 5h4v14H6zm8 0h4v14h-4z" />
          </svg>
        } @else {
          <svg class="ml-0.5 size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M8 5v14l11-7z" />
          </svg>
        }
      </button>
      <button
        type="button"
        aria-label="Siguiente"
        (click)="nextTrack()"
        [disabled]="!canGoToNextTrack"
        class="transition-colors hover:text-[var(--color-player-text)] disabled:cursor-not-allowed disabled:opacity-40"
      >
        <svg class="size-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M16 5h2v14h-2zM5 6v12l10-6z" />
        </svg>
      </button>
      <button
        type="button"
        aria-label="Reproducción aleatoria"
        [attr.aria-pressed]="randomMode"
        [style.color]="randomMode ? 'var(--color-player-control-icon)' : null"
        [style.background-color]="randomMode ? 'var(--color-player-control-background)' : null"
        (click)="toggleRandomMode()"
        class="ml-2 rounded p-1 transition-colors hover:text-[var(--color-player-text)]"
      >
        <svg class="size-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M17 3h4v4l-1.6-1.6-3.2 3.2-1.4-1.4 3.2-3.2L17 3ZM3 7h3.2c1.7 0 3.3.8 4.3 2.2l4.8 6.6c.6.8 1.5 1.2 2.5 1.2H21v2h-3.2c-1.7 0-3.3-.8-4.3-2.2L8.7 11c-.6-.8-1.5-1.2-2.5-1.2H3V7Zm0 10h3.2c.7 0 1.3-.2 1.8-.6l1.2 1.7A4.9 4.9 0 0 1 6.2 19H3v-2Zm13.5-6.2 1.4-1.4 1.5 1.5L21 9v4h-4l1.6-1.6-2.1-2.1Z"
          />
        </svg>
      </button>
    </div>

    <div
      class="flex w-full max-w-[810px] items-center gap-2 text-[11px] leading-none text-[var(--color-player-secondary)]"
    >
      <span class="shrink-0">{{ formatTime(currentTime) }}</span>
      <input
        type="range"
        min="0"
        [max]="duration || 0"
        [value]="currentTime"
        [disabled]="duration === 0"
        (input)="seek(audio, $event)"
        [style.background]="rangeBackground(currentTime, duration)"
        class="h-1 min-w-0 flex-1 cursor-pointer appearance-none rounded-full disabled:cursor-not-allowed [&::-moz-range-thumb]:size-3 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:bg-[var(--color-player-control-background)] [&::-webkit-slider-thumb]:size-3 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-[var(--color-player-control-background)]"
        aria-label="Posición de reproducción"
      />
      <span class="shrink-0">{{ formatTime(duration) }}</span>
    </div>
  </div>

  <div class="flex items-center justify-end gap-3 text-[var(--color-player-text)]">
    <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="currentColor" aria-label="Volumen">
      <path
        d="M3 9v6h4l5 4V5L7 9H3Zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.5 4.5 0 0 0 16.5 12ZM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54Z"
      />
    </svg>
    <input
      type="range"
      min="0"
      max="1"
      step="0.01"
      [value]="volume"
      (input)="setVolume(audio, $event)"
      [style.background]="rangeBackground(volume, 1)"
      class="h-1 w-[138px] cursor-pointer appearance-none rounded-full [&::-moz-range-thumb]:size-3 [&::-moz-range-thumb]:rounded-full [&::-moz-range-thumb]:border-0 [&::-moz-range-thumb]:bg-[var(--color-player-control-background)] [&::-webkit-slider-thumb]:size-3 [&::-webkit-slider-thumb]:appearance-none [&::-webkit-slider-thumb]:rounded-full [&::-webkit-slider-thumb]:bg-[var(--color-player-control-background)]"
      aria-label="Volumen"
    />
  </div>
  @if (playbackError) {
    <span
      class="absolute right-4 top-1 text-[10px] text-[var(--color-player-error)]"
      role="alert"
    >
      {{ playbackError }}
    </span>
  }
</section>
